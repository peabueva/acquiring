<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключение договора эквайринга — демо</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/tokens.css">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/demo-frame/demo-frame.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/tumbler/tumbler.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/close-button/close-button.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/back/back.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/switch/switch.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/MarieSmi/ui-kit@1.20.1/components/button/button.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--background-unaccented_background-color);
    font-family: var(--font-font-family-default), sans-serif;
    color: var(--text-text-color);
  }
  .stage {
    position: absolute; left: 0; top: 0; width: 1024px; height: 768px; overflow: hidden;
    background: #e9eaee; /* нет токена: подложка сцены, компонент показан отдельно */
  }

  /* ===== Компонент «ДОГОВОР» (Figma 29823:237281) ===== */
  .contract {
    position: absolute; right: 0; top: 0; width: 602px; height: 768px; display: flex;
    background: var(--background-unaccented_background-color);
    box-shadow: -6px 0 11px rgba(0,0,0,.11), 0 -2px 4px rgba(0,0,0,.02); /* нет токена: тень из макета */
  }
  .contract[hidden] { display: none; }
  .contract__main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .contract__body { flex: 1 1 0; min-height: 0; overflow: auto; padding: 0 0 24px var(--offset-offset_s); }
  .contract__foot { flex: none; }

  /* Скролл как в Saby (Controls/scroll): нативная полоса скрыта, своя полоса поверх контента,
     видна при наведении на область; ширина 4px, при наведении на полосу — 10px */
  .scroll { position: relative; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  .scroll > .contract__body { scrollbar-width: none; }
  .scroll > .contract__body::-webkit-scrollbar { display: none; }
  .vsb { position: absolute; top: 0; right: 0; bottom: 0; box-sizing: border-box; padding: var(--components-scrollbar-padding_scrollbar);
    width: calc(4px + 2 * var(--components-scrollbar-padding_scrollbar)); visibility: hidden; transition: width .3s ease-in-out; z-index: 2; }
  .scroll:hover > .vsb, .vsb.is-drag { visibility: visible; }
  .vsb:hover, .vsb.is-drag { width: calc(10px + 2 * var(--components-scrollbar-padding_scrollbar)); }
  .vsb[hidden] { display: none; }
  .vsb__thumb { position: relative; width: 100%; border-radius: 100px; background: rgba(205, 205, 205, .8); /* нет токена: цвет ползунка Saby */ }

  /* Шапка стартового экрана */
  .head { height: 46px; flex: none; display: flex; align-items: center; padding: 0 12px 2px var(--offset-offset_xl); }
  .head__title {
    flex: 1 1 0; margin: 0; font-size: var(--font-font-size-font-size_4xl);
    font-weight: 600; /* нет токена */ letter-spacing: -0.282px; line-height: 1;
  }
  /* Шапка вложенного экрана: подпись-раздел + «назад» с заголовком */
  .crumb { height: 46px; flex: none; display: flex; align-items: center; padding: 0 0 0 var(--offset-offset_xl);
    font-size: var(--font-font-size-font-size_m); color: var(--text-label_text-color); }
  .backrow { flex: none; padding: 0 0 8px 6px; }
  .backrow .back { font-weight: 600; /* нет токена */ }

  .caption {
    margin: 0; padding: var(--offset-offset_s) var(--offset-offset_m) var(--offset-offset_2xs);
    font-size: var(--font-font-size-font-size_l); font-weight: 400; line-height: 20px;
    color: var(--text-label_text-color); letter-spacing: -0.2115px;
  }
  .card { background: var(--background-background-color); border-radius: 16px; /* нет токена */ }
  .menu-card { padding: 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  .menu-sub { height: 32px; display: flex; align-items: center; padding: 0 10px;
    font-size: var(--font-font-size-font-size_l); color: var(--text-label_text-color); letter-spacing: -0.2115px; }

  /* Пункт меню (BricksMenu/itemMenu) — в ui-kit нет, по макету */
  .menu-item {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; align-items: flex-start;
    padding: 0 16px 0 var(--offset-offset_m); border-radius: 16px; /* нет токена */
  }
  .menu-item:hover { background: var(--components-dropdownpopup-item_hover_background-color_menu); }
  .menu-item__icon, .method__icon {
    flex: none; width: 24px; height: 24px; font-family: var(--icon-font-family-m_icon_font-family);
    font-size: var(--icon-icon_size-icon-size_m); line-height: 24px; color: var(--icon-secondary_icon-color); text-align: center;
  }
  .menu-item__icon { margin: 4px var(--offset-offset_s) 0 0; }
  .menu-item__text { flex: 1 1 0; min-width: 0; padding: 7px 0 var(--components-popup-menu-item_padding-bottom_menu);
    display: flex; flex-direction: column; gap: var(--offset-offset_3xs); }
  .menu-item__title { font-size: var(--font-font-size-font-size_l); letter-spacing: -0.2115px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item__desc { font-size: var(--font-font-size-font-size_xs); letter-spacing: -0.1692px; color: var(--text-unaccented_text-color); }

  /* Плашки банков (плашка банка) — по макету: 267×56, r12, отступ 12 */
  .banks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bank {
    all: unset; box-sizing: border-box; height: 56px; padding: 12px; display: flex; align-items: center; gap: 12px;
    background: var(--background-background-color); border-radius: 12px; /* нет токена */
    font-size: var(--font-font-size-font-size_l); letter-spacing: -0.2115px; cursor: default;
  }
  .bank[data-go] { cursor: pointer; }
  .bank:hover { background: var(--background-hover_background-color); }
  .bank img { width: 32px; height: 32px; object-fit: contain; flex: none; }
  /* Вариант «иконки 24»: плашка 48, логотип 24, шрифт 15 */
  .banks-s .bank { height: 48px; }
  .banks-s .bank img { width: 24px; height: 24px; }
  .bank__stub { width: 32px; height: 32px; flex: none; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;
    background: #333; color: #fff; font-weight: 600; /* нет токена: заглушка логотипа «Долями» */ }

  /* Карточки способа оплаты (выбор типа) — 542×63, r12 */
  .methods { display: flex; flex-direction: column; gap: 8px; }
  .method {
    all: unset; box-sizing: border-box; padding: 12px; display: flex; align-items: flex-start; gap: 12px;
    background: var(--background-background-color); border-radius: 12px; /* нет токена */ cursor: default;
  }
  .method[data-go] { cursor: pointer; }
  .method:hover { background: var(--background-hover_background-color); }
  .method__icon { margin-top: 6px; }
  .method__title { font-size: var(--font-font-size-font-size_l); letter-spacing: -0.2115px; }
  .method__desc { margin-top: 4px; font-size: var(--font-font-size-font-size_m); color: var(--text-unaccented_text-color); letter-spacing: -0.1974px; }

  /* Список организаций (терминал) */
  .orgs { padding: 8px 0; border-radius: 12px; /* нет токена */ }
  .org {
    all: unset; box-sizing: border-box; width: 100%; height: 31px; padding: 0 24px 0 16px; display: flex; align-items: center; gap: 42px;
    cursor: default;
  }
  .org[data-go] { cursor: pointer; }
  .org:hover { background: var(--background-hover_background-color); }
  .org__name { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--font-font-size-font-size_m); }
  .org__name small { font-size: var(--font-font-size-font-size_xs); color: var(--text-unaccented_text-color); margin-left: 4px; }
  .org__num { font-size: var(--font-font-size-font-size_xs); color: var(--text-unaccented_text-color); }
  .org__nums { display: flex; gap: 12px; flex: none; }

  /* Шапка выбора компании: раздел + эквайер + поиск */
  .crumb__acq { margin-left: 12px; }
  .search {
    margin-left: auto; margin-right: 4px; width: 182px; height: 24px; box-sizing: border-box; display: flex; align-items: center;
    padding: 0 6px 0 8px; border: 1px solid var(--border-pale_border-color); border-radius: 12px; /* нет токена */
    background: var(--background-background-color);
  }
  .search input { all: unset; flex: 1 1 0; min-width: 0; font-size: var(--font-font-size-font-size_m); color: var(--text-text-color); }
  .search input::placeholder { color: var(--text-label_text-color); }
  .search i { font-style: normal; font-family: "cbuc-icons"; font-size: 16px; color: var(--icon-secondary_icon-color); }

  /* Дерево компаний и точек продаж */
  .tree { padding: 6px 0; border-radius: 12px; /* нет токена */ }
  .node {
    box-sizing: border-box; width: 100%; display: flex; align-items: flex-start; cursor: default;
    padding: 5px 12px 5px 38px; min-height: 31px;
  }
  .node:hover { background: var(--background-hover_background-color); }
  .node[data-go] { cursor: pointer; }
  .node--company { align-items: center; }
  .node--child { padding-left: 56px; }
  .node__exp { all: unset; width: 16px; margin: 0 10px 0 -26px; font-family: "cbuc-icons"; font-size: 16px; color: var(--icon-secondary_icon-color); cursor: pointer; text-align: center; }
  .node__title { font-size: var(--font-font-size-font-size_l); letter-spacing: -0.2115px; }
  .node__addr { margin-top: 3px; font-size: var(--font-font-size-font-size_xs); color: var(--text-unaccented_text-color); }
  .tree__empty { padding: 12px 38px; font-size: var(--font-font-size-font-size_m); color: var(--text-unaccented_text-color); }

  /* ===== Карточка договора ===== */
  .crumb__icon { font-family: "cbuc-icons"; font-size: 16px; color: var(--icon-label_icon-color); margin-right: 6px; }
  .crumb__company { margin-left: 12px; }
  /* Кнопки ✓ / ✎ — как в Saby (bu.sabyd.ru): правый край кнопки на 12px от правого края блока */
  .crumb .crumb__action { margin-left: auto; margin-right: 12px; }
  .save-btn {   /* Button: filled, success, circle, size l (28), иконка 24 белая */
    all: unset; box-sizing: border-box; cursor: pointer; width: 28px; height: 28px; border-radius: 100px; display: flex; align-items: center; justify-content: center;
    background: var(--background-contrast-success_color); color: var(--icon-contrast_icon-color);
    font-family: var(--icon-font-family-m_icon_font-family); font-size: var(--icon-icon_size-icon-size_m); line-height: 24px;
  }
  .save-btn:hover { background: var(--background-contrast-success_hover_color); }
  .save-btn:active { background: var(--background-contrast-success_active_color); }
  .edit-btn {   /* linkButton, только иконка 24, цвет secondary, при наведении secondary_hover; без подложки */
    all: unset; box-sizing: border-box; cursor: pointer; width: 24px; height: 28px; display: flex; align-items: center; justify-content: center;
    font-family: var(--icon-font-family-m_icon_font-family); font-size: var(--icon-icon_size-icon-size_m); line-height: 24px;
    color: var(--icon-secondary_icon-color); transition: color .1s;
  }
  .edit-btn:hover, .edit-btn:active { color: var(--icon-secondary_hover_icon-color); }

  .cblocks { display: flex; flex-direction: column; gap: 8px; }
  /* Блоки карточки — как в Saby: r12, отступы 16 сверху/снизу и 12 по бокам, строки 24, зазор 8 */
  .cblock { background: var(--background-background-color); border-radius: 12px; /* нет токена */ padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .cblocks > .cblock:first-child { padding-bottom: 12px; gap: 12px; }
  .cblock--list { padding: 12px; gap: 8px; }
  .cblock__row { display: flex; align-items: center; gap: 8px; min-height: 24px; font-size: var(--font-font-size-font-size_m); }
  .lbl { color: var(--text-label_text-color); flex: none; }
  .lbl--w { width: 60px; }
  .info-i { font-style: normal; font-family: "cbuc-icons"; font-size: 16px; color: var(--icon-label_icon-color); cursor: help; }
  .link { all: unset; cursor: pointer; color: var(--text-link_text-color); }
  .link:hover { color: var(--text-link_hover_text-color); }
  .is-view .link--edit { color: var(--text-text-color); cursor: default; }

  .bankhead { display: flex; align-items: center; gap: 12px; }
  .bankhead img { width: 40px; height: 40px; flex: none; }
  .bankhead__name { font-size: var(--font-font-size-font-size_4xl); font-weight: 600; /* нет токена */ letter-spacing: -0.28px; flex: none; }
  .uline { all: unset; box-sizing: border-box; flex: 1 1 0; min-width: 0; height: 24px; border-bottom: 1px solid var(--border-pale_border-color);
    font-size: var(--font-font-size-font-size_m); color: var(--text-text-color); }
  .uline::placeholder { color: var(--text-readonly_text-color); }
  .uline:focus { border-bottom-color: var(--text-label_text-color); }
  .uline--note { font-size: var(--font-font-size-font-size_l); }
  .uline--note::placeholder { color: var(--text-unaccented_text-color); }
  /* Строка «Договор № … от …» — как на проде: поле номера тянется до «от» */
  /* Реквизиты терминала (Figma «Мастер подключения договоров», ДОГОВОР_терминал/Пустой):
     «№ договора (мерчанта)» → поле → «от» → дата 62 → календарь, зазоры 8; ниже подсказка 13px */
  .cblocks > .cblock--req:first-child { gap: 16px; } /* строка договора на 20px ниже линии примечания, как в макете */
  .contract-no { gap: 8px; }
  .contract-no__num { flex: 1 1 0; }
  .contract-no .uline--date { width: 62px; }
  .contract-no .contract-no__cal { width: 16px; text-align: center; cursor: pointer; }
  .is-view .contract-no__cal { visibility: hidden; }
  .contract-no .uline--date::placeholder { color: var(--text-text-color); }
  /* Строка банка (новый макет): название 20, крестик 16, примечание 15, меню справа; общая линия снизу */
  .bankhead__line { flex: 1 1 0; min-width: 0; display: flex; align-items: baseline; padding-bottom: 6px;
    border-bottom: 1px solid #d2d6da; /* нет токена: цвет линии из макета */ }
  .bankhead__clear { all: unset; cursor: pointer; margin: 0 10px 0 2px; line-height: 1; font-family: "cbuc-icons"; font-size: 16px; color: var(--text-readonly_text-color); }
  .bankhead__clear:hover { color: var(--text-unaccented_text-color); }
  .bankhead__note { all: unset; flex: 1 1 0; min-width: 0; font-size: var(--font-font-size-font-size_l); color: var(--text-text-color); }
  .bankhead__note::placeholder { color: #aab0c1; /* нет токена: цвет подсказки из макета */ }
  .bankhead__menu { all: unset; cursor: pointer; line-height: 1; align-self: center; font-family: "cbuc-icons"; font-size: 16px; color: var(--text-readonly_text-color); }
  .bankhead__menu:hover { color: var(--text-unaccented_text-color); }
  .cblock__hint { margin-top: 8px; font-size: var(--font-font-size-font-size_s, 13px); line-height: 16px; color: var(--text-unaccented_text-color); }
  .cblock__hint .link { cursor: pointer; }
  .cblock--notify { padding: 12px; gap: 6px; }
  .cblock--notify .cblock__hint { margin-top: 0; }
  /* Получатели уведомлений (Figma 20858:148861 просмотр / 20858:148905 редактирование) */
  .recips { display: flex; align-items: center; gap: 8px; min-height: 24px; min-width: 0; font-size: var(--font-font-size-font-size_m); }
  .recips__list { position: relative; display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 255px; overflow: hidden; white-space: nowrap; }
  .is-view .recips__list { max-width: 320px; }
  .recips__list.is-over::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 25px;
    background: linear-gradient(to right, transparent, var(--background-background-color)); }
  .recips__name { flex: none; color: var(--text-text-color); display: inline-flex; align-items: center; gap: 2px; }
  .recips__x, .recips__clear { all: unset; cursor: pointer; font-family: "cbuc-icons"; font-size: 16px; line-height: 1; color: var(--text-readonly_text-color); }
  .recips__x:hover, .recips__clear:hover { color: var(--text-unaccented_text-color); }
  .recips__more { flex: none; color: var(--text-label_text-color); }
  .recips__add { all: unset; cursor: pointer; flex: none; color: var(--text-label_text-color); }
  .recips__add:hover { color: var(--text-label_hover_text-color); }
  .recips__empty { color: var(--text-text-color); }
  .uline--date { flex: none; width: 58px; }
  .uline--pct { flex: none; width: 34px; text-align: right; }
  .is-view .uline { border-bottom-color: transparent; pointer-events: none; }
  .note-view { font-size: var(--font-font-size-font-size_l); color: var(--text-unaccented_text-color); flex: 1 1 0; }
  .status { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 12px; /* нет токена */
    background: var(--background-success_hover_background-color); font-size: var(--font-font-size-font-size_m); }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--icon-success_icon-color); }

  .notice { padding: 10px 12px; border-radius: 12px; /* нет токена */ background: var(--background-info_hover_background-color);
    font-size: var(--font-font-size-font-size_l); line-height: 1.35; color: var(--text-label_contrast_text-color); }
  .cblock .btn { align-self: flex-start; }
  .cblock .switch { --sw: 1; }
  .cblock .switch__caption { color: var(--text-label_text-color); font-size: var(--font-font-size-font-size_m); }
  .is-view .switch { opacity: .5; }
  .cblock__title { font-size: 16px; line-height: 20px; display: flex; align-items: center; gap: 12px; padding-top: 2px; }
  .plus { all: unset; cursor: pointer; width: 32px; height: 24px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--background-contrast-pale_color); font-family: var(--icon-font-family-m_icon_font-family); font-size: 20px; color: var(--icon-icon-color); }
  .plus:hover { background: var(--background-hover_background-color); }
  /* Комиссия (по макету): «Комиссия» 16, поле 35px с линией, «%» и «по договору» 14 цвета метки, зазоры 8/6/6/6 */
  .cblock--fee { gap: 12px; }
  .fee { display: flex; align-items: center; height: 24px; }
  .fee__title { font-size: 16px; margin-right: 12px; }
  .fee__input { flex: none; width: 38px; text-align: right; border-bottom-color: #d2d6da; /* нет токена: цвет линии поля из макета */ margin-right: 8px; }
  .fee .lbl { font-size: var(--font-font-size-font-size_m); margin-right: 6px; }
  .is-view .fee__input { border-bottom-color: transparent; }
  .cblock__desc { font-size: var(--font-font-size-font-size_m); line-height: 1.4; color: var(--text-readonly_text-color); }
  .cblock__empty { color: var(--components-list-placeholder_text-color_list); }
  .term-row { display: flex; align-items: center; gap: 4px; min-height: 24px; padding-left: 4px; font-size: var(--font-font-size-font-size_m); }
  .term-row__id { color: var(--text-label_text-color); }
  .term-row__del { all: unset; cursor: pointer; margin-left: auto; width: 24px; height: 24px; text-align: center; line-height: 24px;
    font-family: var(--icon-font-family-m_icon_font-family); font-size: 24px; color: var(--icon-danger_icon-color); visibility: hidden; }
  .term-row:hover .term-row__del { visibility: visible; }
  .term-row__del:hover { color: var(--icon-danger_hover_icon-color); }

  /* Подсказка внизу панели */
  .hint { position: relative; display: flex; align-items: flex-end; min-height: 130px; margin: 0 8px 12px; padding: 0 0 0 12px; cursor: default; }
  .hint[data-go] { cursor: pointer; }
  .hint__text { flex: 1 1 0; padding: 0 12px 4px 0; max-width: 330px; }
  .hint__title { margin: 0 0 12px; font-size: 17px; font-weight: 600; /* нет токена */ letter-spacing: -0.24px; }
  .hint__desc { margin: 0 0 12px; font-size: var(--font-font-size-font-size_l); line-height: 1.33; letter-spacing: -0.2115px; }
  .hint__link { font-size: var(--font-font-size-font-size_m); color: var(--text-link_text-color); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
  .hint__link i { font-style: normal; font-family: "cbuc-icons"; font-size: 16px; }
  .hint__img { width: 170px; height: 130px; flex: none; object-fit: contain; }

  /* Тулбар справа (Тулбар Saby Trade) — в ui-kit нет, по макету */
  .side-toolbar { flex: none; width: 52px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 0; }

/* ---------- Разметка ---------- */
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const companyTree = (next) => {
  const q = companyQuery.trim().toLowerCase();

  const rows = COMPANIES.map((c, i) => {

/* Блок «Уведомлять об ошибках» с получателями: просмотр — список или «выбрать получателей», редактирование — с крестиками */
const RECIPIENTS = ['Александров А.В.', 'Петров И.П.', 'Печорин П.Н.', 'Лебедев Д.С.', 'Смирнова О.К.', 'Волков Е.А.'];
const notifyBlock = (c, view) => {
  const r = c.recips || (c.recips = []);
  let right;
  if (!r.length) right = view
    ? `<span class="recips__empty">выбрать получателей</span><i class="info-i" title="Подсказка">&#xE64B;</i>`
    : `<button class="link" type="button" data-recip="pick">выбрать получателей</button>`;
  else right = `<span class="recips__list" data-recips>${r.map((n, i) => `<span class="recips__name">${esc(n)}${view ? (i < r.length - 1 ? ',' : '') : `<button class="recips__x" type="button" title="Убрать" data-recip="del" data-i="${i}">&#xE66C;</button>`}</span>`).join(' ')}</span>
      <span class="recips__more" data-recips-more hidden></span>
      ${view ? '<i class="info-i" title="Подсказка">&#xE64B;</i>'
             : `${r.length < RECIPIENTS.length ? '<button class="recips__add" type="button" data-recip="add">+ еще</button>' : ''}<button class="recips__clear" type="button" title="Очистить" data-recip="clear">&#xE66C;</button>`}`;
  return `<div class="cblock cblock--notify">
    <div class="recips"><span class="lbl">Уведомлять об ошибках</span>${right}</div>
    ${view ? '' : '<div class="cblock__hint">Отправим уведомление, если возникнут проблемы с приемом оплат</div>'}</div>`;
};
/* Сколько получателей не поместилось — «(N)» после списка с затуханием */
function fitRecips() {
  screen.querySelectorAll('[data-recips]').forEach(list => {
    const more = list.parentElement.querySelector('[data-recips-more]');
    const box = list.getBoundingClientRect(); let hidden = 0;
    list.querySelectorAll('.recips__name').forEach(n => { if (n.getBoundingClientRect().right > box.right + 1) hidden++; });
    list.classList.toggle('is-over', hidden > 0); more.hidden = !hidden; more.textContent = `(${hidden})`;
  });
}

/* Карточка договора. mode: empty — форма подключения, edit — редактирование, view — просмотр */
const sw = (key, k, caption, info) => { const c = CARDS[key]; return `
  <div class="cblock__row"><label class="switch switch--caption-start">
    <input class="switch__input" type="checkbox" role="switch" data-card="${key}" data-sw="${k}"${c.sw[k] ? ' checked' : ''}>
    <span class="switch__button"></span><span class="switch__caption">${caption}</span></label>
    ${info ? '<i class="info-i" title="Подсказка">&#xE64B;</i>' : ''}</div>`; };

const card = (key, mode) => {
  const c = CARDS[key], st = c.states, isTerm = key === 'terminal', view = mode === 'view';
  if (isTerm && view) {            // в макете просмотр терминала уже с данными договора и терминалом
    c.contract = c.contract || '15245636'; c.date = c.date || '12.02.22';
    if (!c.terminals.length) c.terminals.push(['Ресторан Мили', '235885666']);
  }
  const action = mode === 'empty' ? '' : view
    ? `<button class="edit-btn crumb__action" type="button" title="Редактировать"${go(st.edit)} data-pin>&#xE660;</button>`
    : `<button class="save-btn crumb__action" type="button" title="Сохранить"${go(st.view)} data-pin>&#xE75E;</button>`;
  const head = `<div class="crumb"><span class="crumb__icon">${c.icon}</span>${c.method}<span class="crumb__company">Мили</span>${action}</div>`;

  const termEdit = isTerm && !view;   // в карточке терминала строка банка по новому макету
  const bank = `<div class="bankhead"><img src="img/banks/alfa.svg" alt="">
      ${termEdit
        ? `<div class="bankhead__line"><span class="bankhead__name">Альфа-Банк</span>
             <button class="bankhead__clear" type="button" title="Очистить" data-toast="Сменить банк">&#xE66C;</button>
             <input class="bankhead__note" placeholder="Примечание" value="${esc(c.note)}" data-card="${key}" data-f="note">
             <button class="bankhead__menu" type="button" title="Меню" data-toast="Меню договора">&#xEA90;</button></div>`
        : `<span class="bankhead__name">Альфа-Банк</span>
           ${view ? `<span class="note-view">${esc(c.note || 'Основной')}</span><span class="status">включен</span>`
                  : `<input class="uline uline--note" placeholder="Примечание" value="${esc(c.note)}" data-card="${key}" data-f="note">`}`}
    </div>`;

  let first;
  if (mode === 'empty') {
    first = `<div class="cblock">${bank}
      <div class="notice">${c.notice} <a class="link" href="#" onclick="return false">инструкции</a></div>
      <div class="cblock__row"><span class="lbl lbl--w">Логин</span><input class="uline" placeholder="Логин с суффиксом «–api»" value="${esc(c.login)}" data-card="${key}" data-f="login"></div>
      <div class="cblock__row"><span class="lbl lbl--w">Пароль</span><input class="uline" type="password" placeholder="Пароль от боевой среды" value="${esc(c.password)}" data-card="${key}" data-f="password"></div>
      <button class="btn btn--outlined btn--style-secondary btn--size-m" type="button"${go(st.edit)} data-pin>Подключить</button>
    </div>`;
  } else if (isTerm) {
    first = `<div class="cblock cblock--req">${bank}
      <div><div class="cblock__row contract-no"><span class="lbl">№ договора (мерчанта)</span>
        <input class="uline contract-no__num" value="${esc(c.contract)}" data-card="${key}" data-f="contract" aria-label="Номер договора">
        <span class="lbl contract-no__from">от</span><input class="uline uline--date" placeholder="   .     ." value="${esc(c.date)}" data-card="${key}" data-f="date" aria-label="Дата договора">
        <i class="info-i contract-no__cal" title="Календарь">&#xE6C4;</i></div>
        <div class="cblock__hint">Заполните, если загружаете банковские выписки: по этим данным Saby найдет договор и подставит его в «Поступление от эквайера»</div></div>
    </div>`;
  } else {
    first = `<div class="cblock">${bank}
      <div class="cblock__row"><span class="lbl lbl--w">Логин</span><input class="uline" value="${esc(c.login || 'mili-api')}" data-card="${key}" data-f="login"></div>
      ${view ? '' : `<div class="cblock__row"><span class="lbl lbl--w">Пароль</span>${c.pwEdit
        ? `<input class="uline" type="password" placeholder="Новый пароль" data-card="${key}" data-f="password">`
        : `<button class="link" type="button" data-pw="${key}">Изменить</button>`}</div>`}

  }
  if (mode === 'empty') return head + body(`<div class="cblocks">${first}</div>`);

  const blocks = [first,
    isTerm ? notifyBlock(c, view)   // новый блок уведомлений (Figma «Мастер подключения договоров»)
      : `<div class="cblock">${sw(key, 'notify', 'Уведомлять об ошибках')}</div>`,
    isTerm ? '' : `<div class="cblock">${sw(key, 'save', 'Сохранять данные для следующих оплат', true)}</div>`,
    `<div class="cblock">
      <div class="cblock__row"><span class="lbl">Счет учета</span><button class="link link--edit" type="button" data-toast="Выбор счета учета — отдельное окно в макете">57-03 Продажи по платежным картам</button><i class="info-i" title="Подсказка">&#xE64B;</i></div>
      ${sw(key, 'link', 'Автоматически связывать поступления с оплатами', true)}
      ${sw(key, 'patent', 'Доход относить к Патенту', true)}

    `<div class="cblock cblock--fee">

    </div>`,
  ];
  if (c.blocks.includes('cash')) blocks.push(`<div class="cblock cblock--list">
      <div class="cblock__title">Кассовая ссылка <button class="plus" type="button" title="Добавить" data-go="создание">&#xEADD;</button></div>
      <div class="cblock__desc">Принимаете оплаты на кассе в торговой точке? Подключите новый способ оплаты. <a class="link" href="#" onclick="return false">Подробнее →</a></div></div>`);
  if (c.blocks.includes('points')) blocks.push(`<div class="cblock cblock--list">
      <div class="cblock__title">Точки продаж <button class="plus" type="button" title="Добавить" data-go="Variant2">&#xEADD;</button></div>
      <div class="cblock__desc">Договор действует для всех точек продаж компании <i class="info-i" title="Подсказка">&#xE64B;</i></div></div>`);
  if (isTerm) blocks.push(`<div class="cblock cblock--list">
      <div class="cblock__title">Терминал ${view ? '' : '<button class="plus" type="button" title="Добавить" data-addterm="1">&#xEADD;</button>'}</div>
      ${c.terminals.length ? c.terminals.map(([n, id], i) => `<div class="term-row"><span>${n}</span><span class="term-row__id">${id}</span>${view ? '' : `<button class="term-row__del" type="button" title="Удалить" data-delterm="${i}">&#xE65C;</button>`}</div>`).join('')
        : '<div class="cblock__desc cblock__empty">Укажите данные терминала, чтобы в документе «Выручка розницы» верно определялся договор эквайринга</div>'}</div>`);
  return head + `<div class="contract__body${view ? ' is-view' : ''}"><div class="cblocks">${blocks.join('')}</div></div>`;
};

/* Полоса прокрутки как в Saby: оборачиваем область и рисуем свой ползунок */
function attachScroll(body) {
  const wrap = document.createElement('div'); wrap.className = 'scroll';
  body.replaceWith(wrap); wrap.appendChild(body);
  const bar = document.createElement('div'); bar.className = 'vsb';
  bar.innerHTML = '<div class="vsb__thumb"></div>'; wrap.appendChild(bar);
  const thumb = bar.firstChild;
  const update = () => {
    const { scrollHeight: sh, clientHeight: ch, scrollTop: st } = body;
    bar.hidden = sh <= ch + 1; if (bar.hidden) return;
    const track = bar.clientHeight - 4, h = Math.max(24, track * ch / sh);
    thumb.style.height = h + 'px'; thumb.style.top = ((track - h) * st / (sh - ch)) + 'px';
  };
  body.addEventListener('scroll', update); new ResizeObserver(update).observe(body); update();
  thumb.addEventListener('mousedown', (e) => {          // перетаскивание ползунка
    e.preventDefault(); bar.classList.add('is-drag');
    const y0 = e.clientY, st0 = body.scrollTop, k = (body.scrollHeight - body.clientHeight) / (bar.clientHeight - 4 - thumb.offsetHeight);
    const move = (ev) => { body.scrollTop = st0 + (ev.clientY - y0) / frame.scale * k; };
    const up = () => { bar.classList.remove('is-drag'); removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  });
  bar.addEventListener('mousedown', (e) => {            // клик по дорожке — прокрутка к месту
    if (e.target !== bar) return;
    const r = bar.getBoundingClientRect(); body.scrollTop = ((e.clientY - r.top) / r.height) * body.scrollHeight - body.clientHeight / 2;
  });
}
function open(id) {
  if (id === 'тип2') id = ACQ;

  if (STATES[id] || MODALS[id] || id === 'Первый вход') { if (VARIANT_OF[id]) frame.select(VARIANT_OF[id], id); else frame.select(id); return; }
  toast(OTHER[id] || `«${id}» — нет в макете`);
}

stage.addEventListener('click', (e) => {
  const ok = e.target.closest('[data-ok]'); if (ok) { ok.closest('.modal').remove(); return; }
  const cf = e.target.closest('[data-confirm]'); if (cf) { confirmBox(cf.dataset.confirm); return; }
  const tog = e.target.closest('[data-toggle]');
  if (tog) {                       // раскрыть / свернуть компанию
    e.preventDefault();
    const c = COMPANIES[+tog.dataset.toggle]; c.open = !c.open;
    document.getElementById('tree').outerHTML = companyTree(document.getElementById('tree').dataset.next);
    return;
  }
  if (e.target.closest('.search')) return;
  const pw = e.target.closest('[data-pw]');
  if (pw) { CARDS[pw.dataset.pw].pwEdit = true; render(current); return; }   // «Изменить» пароль
  const rc = e.target.closest('[data-recip]');
  if (rc) {                        // получатели уведомлений
    const r = CARDS.terminal.recips, a = rc.dataset.recip;
    if (a === 'pick') r.push(...RECIPIENTS.slice(0, 3));
    if (a === 'add') { const n = RECIPIENTS.find(x => !r.includes(x)); if (n) r.push(n); }
    if (a === 'del') r.splice(+rc.dataset.i, 1);
    if (a === 'clear') r.length = 0;
    render(current); return;
  }
  const del = e.target.closest('[data-delterm]');
  if (del) { CARDS.terminal.terminals.splice(+del.dataset.delterm, 1); render(current); return; }
  const add = e.target.closest('[data-addterm]');
  if (add) { CARDS.terminal.terminals.push(['Ресторан Мили', '235885666']); render(current); return; }
  const t = e.target.closest('[data-toast]');
  if (t) { if (!t.closest('.is-view')) toast(t.dataset.toast); return; }
  const el = e.target.closest('[data-go]');
  if (el) { e.preventDefault(); open(el.dataset.go); }
});

});
